<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SupplyGuard AI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white px-4 shadow-sm border-bottom">
        <a class="navbar-brand fw-bold text-primary" href="home.html">
            <i class="fa-solid fa-shield-halved me-2"></i>SupplyGuard AI <span class="badge bg-secondary fs-6 ms-2">Enterprise L2</span>
        </a>
        <div class="d-flex align-items-center gap-2">
            <a href="home.html" class="btn btn-sm btn-outline-secondary">Home</a>
            <a href="register.html" class="btn btn-sm btn-primary">Register</a>
        </div>
    </nav>

    <!-- Login Container -->
    <div class="container d-flex flex-grow-1 align-items-center justify-content-center py-5">
        <div class="row w-100 justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card border-0 shadow-sm p-4 rounded-3 border-top border-primary border-4 bg-white">
                    <div class="text-center mb-4">
                        <div class="text-primary fs-1 mb-2"><i class="fa-solid fa-user-shield"></i></div>
                        <h3 class="fw-bold text-dark">Enterprise Login</h3>
                        <p class="text-muted small">Access SupplyGuard AI Command Center</p>
                    </div>
                    <form action="dashboard.html" method="GET">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Enterprise Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                                <input type="email" class="form-control border-start-0" placeholder="admin@supplyguard.ai" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Secure Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                                <input type="password" class="form-control border-start-0" placeholder="••••••••" required>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-3 small">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label text-muted" for="rememberMe">Remember session</label>
                            </div>
                            <a href="#" class="text-primary text-decoration-none">Forgot key?</a>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Authenticate & Launch</button>
                    </form>
                    <div class="text-center mt-3 small">
                        <span class="text-muted">Don't have enterprise access?</span> <a href="register.html" class="text-primary text-decoration-none fw-semibold">Register here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
