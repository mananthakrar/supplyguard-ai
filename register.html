<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SupplyGuard AI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white px-4 shadow-sm border-bottom">
        <a class="navbar-brand fw-bold text-primary" href="index.html">
            <i class="fa-solid fa-shield-halved me-2"></i>SupplyGuard AI <span class="badge bg-secondary fs-6 ms-2">Enterprise L2</span>
        </a>
        <div class="d-flex align-items-center gap-2">
            <a href="index.html" class="btn btn-sm btn-outline-secondary">Home</a>
            <a href="login.html" class="btn btn-sm btn-outline-primary">Login</a>
        </div>
    </nav>

    <!-- Register Container -->
    <div class="container d-flex flex-grow-1 align-items-center justify-content-center py-5">
        <div class="row w-100 justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-sm p-4 rounded-3 border-top border-primary border-4 bg-white">
                    <div class="text-center mb-4">
                        <div class="text-primary fs-1 mb-2"><i class="fa-solid fa-user-plus"></i></div>
                        <h3 class="fw-bold text-dark">Enterprise Registration</h3>
                        <p class="text-muted small">Request Access to SupplyGuard AI Core</p>
                    </div>
                    <form action="dashboard.html" method="GET">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Full Name</label>
                                <input type="text" class="form-control" placeholder="John Doe" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Enterprise Email</label>
                                <input type="email" class="form-control" placeholder="john@supplyguard.ai" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Assign Role</label>
                            <select class="form-select">
                                <option value="admin">Admin (Full Control)</option>
                                <option value="manager">Supply Chain Manager</option>
                                <option value="dispatcher">Dispatcher</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Secure Password</label>
                            <input type="password" class="form-control" placeholder="••••••••" required>
                        </div>
                        <div class="mb-3 form-check small">
                            <input type="checkbox" class="form-check-input" id="termsCheck" required>
                            <label class="form-check-label text-muted" for="termsCheck">I agree to L2 Enterprise security protocols and compliance rules.</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Complete Registration</button>
                    </form>
                    <div class="text-center mt-3 small">
                        <span class="text-muted">Already registered?</span> <a href="login.html" class="text-primary text-decoration-none fw-semibold">Login here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
